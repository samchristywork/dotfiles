set -g status-position top
set -g status-style fg=colour2
set -g mouse on
set -g default-shell /usr/bin/fish
set -g base-index 1
set -g status-right-length 100
set -g escape-time 0
set -g default-terminal "xterm-256color"
set -g terminal-overrides ",xterm-256color:Tc"
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-pain-control'

set -g status-interval 1
set -g status-left ""
set -g status-right ""
set -g status-bg default
set -g status-fg white

set -g window-status-format "#[bg=colour237] #I #W "
set -g window-status-current-format "#[bg=colour237] #[underscore]#[fg=green]#I #W#[default]#[bg=colour237] "
set -g window-status-separator ""

run '~/.tmux/plugins/tpm/tpm'

bind c command-prompt -p "Name of new window: " "new-window -n '%%' -c '#{pane_current_path}'"
bind P command-prompt -p 'save history to filename:' -I '~/tmux.history' 'capture-pane -S -32768 ; save-buffer %1 ; delete-buffer'
bind t select-layout main-vertical

bind -n M-, previous-window
bind -n M-. next-window
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R
bind -n M-J swap-pane -D
bind -n M-K swap-pane -U
bind -n M-w choose-window

unbind h
unbind j
unbind k
unbind l

unbind n
unbind p
